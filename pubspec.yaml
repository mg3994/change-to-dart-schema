name: schemaorg
description: Pure Dart implementation of Schema.org models, site generator, and server.
version: 1.0.0
homepage: https://schema.org

environment:
  sdk: ^3.3.0

dependencies:
  schemantic: ^0.2.2
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  http: ^1.2.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  path: ^1.9.0
  collection: ^1.18.0

dev_dependencies:
  schemantic_builder: ^0.1.2
  json_serializable: ^6.8.0
  build_runner: ^2.4.9
  test: ^1.25.2
  lints: ^3.0.0
